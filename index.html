  --bad-bg: #2E1512; --bad-ink: #FF9080; --bad-border: #7A2C22;
}
/* the stage: the exercise darkens the whole app, whatever the theme */
body.stage {
  color-scheme: dark;
  --bg: #0E0E10;
  --surface: #0E0E10;
  --ink: #F7F6F2;
  --ink2: #9A9890;
  --muted: #6C6A64;
  --hairline: #26272B;
  --rule: #26272B;
  --accent: #3550E8;
  --accent-bg: #151B31;
  --crit: #BE3421;
  --cell: #191A1D;
  --cell-border: #26272B;
  --done-bg: #151B31;
  --done-ink: #7C93E8;
  --done-border: #243055;
  --bad-bg: #2E1512;
  --bad-ink: #FF9080;
  --bad-border: #7A2C22;
}

/* ========== 2. Base ========== */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  transition: background .22s ease, color .22s ease;
}
::selection { background: var(--accent-bg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
* { scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
button { font: inherit; color: inherit; touch-action: manipulation; }
h1, h2 { letter-spacing: -.03em; font-weight: 600; margin: 0; }
h1 { font-size: 26px; line-height: 1.15; }
h2 { font-size: 19px; }
p { margin: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.cap {   /* section label: mono, uppercase, wide */
  font-family: var(--mono); font-size: 11px; font-weight: 400;
  letter-spacing: .12em; text-transform: uppercase; color: var(--ink2);
}
.sub { color: var(--ink2); font-size: 14px; }
.note { color: var(--ink2); font-size: 14px; }
.hair { height: 1px; background: var(--hairline); border: 0; margin: 0; }

/* ========== 3. Shell ========== */
#shell { max-width: 560px; margin: 0 auto; padding: 14px 18px 40px; }
#topbar {
  display: flex; align-items: center; gap: 10px;
  padding-bottom: 12px;
}
#brand { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; }
#brand .name { font-size: 21px; font-weight: 600; letter-spacing: -.03em; display: block; line-height: 1.1; }
#brand .tag { font-size: 13px; color: var(--ink2); }
#topRight { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.seg {
  display: inline-flex; background: var(--hairline); border-radius: 9px; padding: 2px; gap: 2px;
}
.seg button {
  border: 0; background: transparent; color: var(--ink2); cursor: pointer;
  border-radius: 7px; padding: 5px 10px; font-size: 13px; font-weight: 500;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }
.iconBtn {
  border: 1px solid var(--hairline); background: transparent; color: var(--ink2);
  border-radius: 9px; width: 32px; height: 32px; padding: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.iconBtn:hover { color: var(--ink); border-color: var(--rule); }
.iconBtn svg { width: 17px; height: 17px; }
.iconBtn .fsIn { display: none; }
body.fs .iconBtn .fsOut { display: none; }
body.fs .iconBtn .fsIn { display: block; }
body.tgfs #topbar { padding-top: 58px; }
.back {
  border: 0; background: none; color: var(--ink2); cursor: pointer;
  padding: 4px 0; font-size: 14px; margin-bottom: 10px; display: inline-flex; gap: 6px;
}
.back:hover { color: var(--ink); }

/* ========== 4. Buttons ========== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: var(--r-btn); padding: 13px 20px; min-height: 48px;
  border: 1px solid var(--hairline); background: var(--surface); color: var(--ink);
  cursor: pointer; font-size: 15px; font-weight: 500; width: 100%;
}
.btn:hover { border-color: var(--rule); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: transparent; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.15); }
.btn.danger { color: var(--crit); }
.btn.sm { min-height: 38px; padding: 8px 14px; font-size: 14px; width: auto; }
.btn:disabled { opacity: .45; cursor: default; }
.btnRow { display: flex; gap: 10px; margin-top: 10px; }
.btnRow .btn { flex: 1; }

/* ========== 5. Blocks & rows ========== */
.block {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--r-block); padding: 4px 16px;
}
.row {
  display: flex; align-items: center; gap: 12px; min-height: 52px;
  padding: 10px 0; border-top: 1px solid var(--hairline);
}
.row:first-child { border-top: 0; }
.row .grow { flex: 1; min-width: 0; }
.rowMain { font-weight: 500; }
.rowSub { color: var(--ink2); font-size: 13px; }
.rowVal { font-family: var(--mono); font-size: 13px; color: var(--ink2); white-space: nowrap; }

/* record headline */
.record { padding: 16px 0 4px; }
.recordTop { display: flex; align-items: flex-end; gap: 16px; }
.recordVal { font-family: var(--mono); font-weight: 500; font-size: 44px; line-height: 1; letter-spacing: -.02em; }
.recordVal .u { font-size: 17px; color: var(--ink2); margin-left: 4px; }
.recordDelta { font-family: var(--mono); font-size: 13px; margin-top: 6px; }
.recordDelta.up { color: var(--crit); }
.recordDelta.down { color: var(--good); }
.spark { margin-left: auto; }
.spark svg { display: block; }

/* exercise rows */
.exRow { width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--hairline); cursor: pointer; }
.exRow:first-of-type { border-top: 0; }
.exRow:hover .rowMain { color: var(--accent); }
.exIcon { width: 30px; height: 30px; color: var(--ink2); flex: none; }

/* day map */
.days { display: flex; gap: 4px; }
.days i { flex: 1; height: 26px; border-radius: 6px; background: var(--hairline); display: block; }

/* toggle */
.switch { position: relative; width: 42px; height: 24px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span {
  position: absolute; inset: 0; border-radius: 999px; background: var(--hairline);
  transition: background .15s; pointer-events: none;
}
.switch span::after {
  content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s;
}
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* plates */
.plate {
  border-radius: var(--r-btn); padding: 11px 14px; font-size: 14px;
  background: var(--hairline); color: var(--ink2);
}
.plate.mono { font-family: var(--mono); font-size: 13px; }
.plate.good { background: var(--good-bg); color: var(--good); }
.plate.warn { background: var(--crit-bg); color: var(--crit); }
.badge {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 12px; color: var(--ink2);
}
.badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.badge.cloud i { background: var(--accent); }
.badge.err i { background: var(--crit); }

/* ========== 6. Stage ========== */
#scr-stage .stageWrap { display: grid; gap: 18px; }
.stageHead { display: flex; align-items: flex-start; gap: 14px; }
.stageTarget { display: flex; align-items: center; gap: 10px; }
.targetChip {
  font-family: var(--mono); font-weight: 500; font-size: 20px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--cell-border);
  border-radius: var(--r-cell); padding: 5px 16px; min-width: 56px; text-align: center;
}
body.stage .targetChip { background: #F7F6F2; color: #16150F; border-color: transparent; }
.targetChip.red { background: var(--crit); color: #fff; border-color: transparent; }
.stageMeter { margin-left: auto; text-align: right; }
.stageTimer { font-family: var(--mono); font-weight: 500; font-size: 26px; line-height: 1.1; letter-spacing: -.01em; }
.stageErr { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); }
.gridWrap { width: min(100%, 470px); margin: 0 auto; }
.tblGrid { display: grid; gap: 8px; }
.tblGrid button {
  aspect-ratio: 1; border: 1px solid var(--cell-border); border-radius: var(--r-cell);
  background: var(--cell); color: var(--ink);
  font-family: var(--mono); font-weight: 500; cursor: pointer; padding: 0;
  user-select: none; -webkit-user-select: none;
  transition: background .1s, border-color .1s, color .1s;
}
.tblGrid[data-size="4"] button { font-size: clamp(22px, 8vmin, 32px); }
.tblGrid[data-size="5"] button { font-size: clamp(19px, 6.4vmin, 27px); }
.tblGrid[data-size="6"] button { font-size: clamp(16px, 5.2vmin, 22px); }
.tblGrid[data-size="7"] button { font-size: clamp(13px, 4.3vmin, 18px); border-radius: 7px; }
.tblGrid button.redCell { background: var(--crit); color: #fff; border-color: transparent; }
.tblGrid button.ok { background: var(--done-bg); color: var(--done-ink); border-color: var(--done-border); }
.tblGrid button.bad { background: var(--bad-bg); color: var(--bad-ink); border-color: var(--bad-border); }
.tblGrid button.redCell.ok { background: var(--accent); color: #fff; border-color: transparent; }
.tblGrid button.redCell.bad { background: var(--bad-bg); color: var(--bad-ink); border-color: var(--bad-border); }
.stageFoot { display: flex; align-items: center; gap: 12px; }
.stageFoot .cap { color: var(--muted); }
.stageFoot .btn { width: auto; margin-left: auto; min-height: 40px; padding: 9px 16px; font-size: 13px; }
#countdown {
  position: fixed; inset: 0; z-index: 60;
  display: grid; place-items: center; background: var(--bg);
}
#countdown b {
  font-family: var(--mono); font-weight: 500; font-size: clamp(96px, 26vmin, 190px);
  line-height: 1; letter-spacing: -.04em; color: var(--ink);
  animation: cdIn .68s cubic-bezier(.2,.7,.3,1) both;
}
#countdown .ring { position: absolute; width: clamp(190px, 46vmin, 320px); aspect-ratio: 1; }
#countdown .ring circle { fill: none; stroke: var(--accent); stroke-width: 2; opacity: .5; }
#countdown .ring circle { animation: cdRing .68s cubic-bezier(.2,.7,.3,1) both; }
@keyframes cdIn {
  from { transform: scale(1.28); opacity: 0; }
  22%  { opacity: 1; }
  to   { transform: scale(1); opacity: .82; }
}
@keyframes cdRing {
  from { transform: scale(.72); opacity: 0; }
  30%  { opacity: .5; }
  to   { transform: scale(1.06); opacity: 0; }
}
#countdown .ring { transform-origin: center; }
@media (prefers-reduced-motion: reduce) {
  #countdown b, #countdown .ring circle { animation: none; opacity: 1; }
  #countdown .ring { display: none; }
}
.progressLine { height: 2px; background: var(--hairline); border-radius: 2px; overflow: hidden; }
.progressLine i { display: block; height: 100%; width: 100%; background: var(--accent); transform: scaleX(0); transform-origin: left center; transition: transform .18s ease; }
.progressLine.warm i { background: var(--crit); }
/* n-back stage */
.nbTop { display: flex; align-items: center; gap: 12px; }
.pill {
  font-family: var(--mono); font-size: 15px; border: 1px solid var(--cell-border);
  border-radius: 999px; padding: 6px 16px;
}
.pill b { font-weight: 500; font-size: 19px; }
#nbGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(100%, 340px); margin: 0 auto; }
#nbGrid .nc { aspect-ratio: 1; border: 1px solid var(--cell-border); border-radius: 14px; background: var(--cell); transition: background .1s; }
#nbGrid .nc.on { background: var(--accent); border-color: var(--accent); }
.nbAnswers { display: flex; gap: 10px; }
.nbAnswers button {
  flex: 1; border-radius: var(--r-btn); border: 1px solid var(--cell-border); background: var(--cell);
  color: var(--ink); cursor: pointer; padding: 12px 8px; min-height: 62px;
}
.nbAnswers button .t { display: block; font-weight: 600; font-size: 16px; }
.nbAnswers button .k { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
.nbAnswers button.hit { border-color: var(--good); }
.nbAnswers button.hit .k { color: var(--good); }
.nbAnswers button.fa { border-color: var(--bad-border); }
.nbAnswers button.fa .k { color: var(--bad-ink); }
/* gorbov switch log */
.swLog { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.swLog div {
  display: flex; justify-content: space-between; gap: 8px;
  font-family: var(--mono); font-size: 12px; border: 1px solid var(--cell-border);
  border-radius: 8px; padding: 5px 9px; color: var(--ink);
}
.swLog div.red { background: var(--bad-bg); border-color: var(--bad-border); color: var(--bad-ink); }
.swLog div em { font-style: normal; color: var(--muted); }
.swLog div.red em { color: var(--bad-ink); opacity: .8; }

/* ========== 7. Result ========== */
.resHero { font-family: var(--mono); font-weight: 500; font-size: 60px; line-height: 1; letter-spacing: -.03em; margin: 6px 0 12px; }
.resHero .u { font-size: 20px; color: var(--ink2); margin-left: 6px; letter-spacing: 0; }
.metrics { display: flex; }
.metrics div { flex: 1; padding: 12px 0 12px 14px; border-left: 1px solid var(--hairline); }
.metrics div:first-child { padding-left: 0; border-left: 0; }
.metrics .v { font-family: var(--mono); font-weight: 500; font-size: 22px; }
.metrics .v small { font-size: 12px; color: var(--ink2); }
.bars { display: flex; align-items: flex-end; gap: 2px; height: 90px; }
.bars i { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; opacity: .55; min-height: 2px; }
.bars i.max { background: var(--crit); opacity: 1; }
.barsAxis { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 4px; }

/* ========== 8. Statistics ========== */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button {
  border: 1px solid var(--hairline); background: var(--surface); color: var(--ink2);
  border-radius: 999px; padding: 6px 13px; font-size: 13px; cursor: pointer;
}
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: transparent; font-weight: 500; }
.kpi { display: grid; grid-template-columns: 1fr 1fr; }
.kpi > div { padding: 14px 0 14px 16px; border-top: 1px solid var(--hairline); border-left: 1px solid var(--hairline); }
.kpi > div:nth-child(-n+2) { border-top: 0; }
.kpi > div:nth-child(odd) { padding-left: 0; border-left: 0; }
.kpi .v { font-family: var(--mono); font-weight: 500; font-size: 27px; line-height: 1.1; }
.kpi .v small { font-size: 13px; color: var(--ink2); }
.kpi .d { font-family: var(--mono); font-size: 12px; margin-top: 2px; }
.kpi .d.up { color: var(--crit); }
.kpi .d.down { color: var(--good); }
#chartBox { position: relative; }
#chartBox svg { display: block; width: 100%; height: auto; }
.chartAxis { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--muted); }
.heat { display: grid; gap: 4px; width: min(100%, 380px); }
.heat div {
  aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 12px;
}
table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 13px; }
th {
  text-align: left; font-weight: 400; font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted); padding: 0 8px 8px 0; border-bottom: 1px solid var(--rule);
}
td { padding: 9px 8px 9px 0; border-bottom: 1px solid var(--hairline); font-variant-numeric: tabular-nums; }
th.num, td.num { text-align: right; padding-right: 0; }
th.del, td.del { width: 30px; padding-right: 0; text-align: right; }
.rowDel {
  border: 0; background: none; color: var(--muted); cursor: pointer; padding: 2px 4px; border-radius: 6px;
  font-family: var(--mono); font-size: 14px; line-height: 1;
}
.rowDel:hover { color: var(--crit); }
.rowDel.armed { color: #fff; background: var(--crit); }
.ok { color: var(--good); }
.tscroll { overflow-x: auto; }
.empty { color: var(--muted); font-size: 14px; padding: 18px 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.sec { margin-top: 26px; }
.sec > .cap { display: block; margin-bottom: 10px; }
#importReport { margin-top: 10px; }

/* ========== 9. Adaptation ========== */
@media (max-width: 400px) {
  #shell { padding: 12px 14px 34px; }
  h1 { font-size: 23px; }
  .recordVal { font-size: 38px; }
  .resHero { font-size: 48px; }
  .tblGrid { gap: 6px; }
  .swLog { grid-template-columns: repeat(2, 1fr); }
}
/* the grid must never outgrow the window: it is square, so cap it by leftover height */
/* the stage fills the window and centres the grid, so the fixation point always
   lands in the same place on screen */
body.stage #shell {
  padding-top: 10px;
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column;
}
body.stage #scr-stage { flex: 1 1 auto; display: flex; }
body.stage .stageWrap { flex: 1 1 auto; align-content: stretch; grid-template-rows: minmax(0, 1fr); }
body.stage .stageMain {
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto auto; gap: 14px;
}
body.stage #stageBody { display: flex; align-items: center; justify-content: center; }
body.stage .gridWrap { width: min(100%, 470px, calc(100vh - 210px)); }
/* the red-black stage also carries the sequence hint and the switch log */
body.stage .gorbovWrap { width: min(100%, 470px, calc(100vh - 348px)); }
@media (max-height: 680px) {
  body.stage .swLog, body.stage .stageExtraCap { display: none; }
  body.stage .gorbovWrap { width: min(100%, 470px, calc(100vh - 264px)); }
}
body.stage #nbGrid { width: min(100%, 340px, calc(100vh - 300px)); }
.rail { display: none; }
@media (min-width: 1024px) {
  body.stage #shell { max-width: 1180px; }
  body.stage #scr-stage .stageWrap {
    grid-template-columns: 220px minmax(0, 1fr) 230px;
    gap: 34px; align-items: stretch;
  }
  body.stage .rail { align-self: start; }
  body.stage .gridWrap { width: min(100%, 470px, calc(100vh - 190px)); }
  .rail { display: block; }
  .rail .cap { display: block; margin-bottom: 8px; }
  .railR { text-align: left; }
  body.stage .stageMain { gap: 16px; }
}
@media (min-width: 720px) and (max-width: 1023px) {
  #shell { max-width: 620px; }
}
</style>

    </button>

      <button class="iconBtn" id="btnFs" hidden>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path class="fsOut" d="M7.5 2.5h-5v5M12.5 2.5h5v5M7.5 17.5h-5v-5M12.5 17.5h5v-5"/>

  </section>

  <!-- ===== pre-launch ===== -->

    <button class="back navBack">←&nbsp;<span data-i18n="back"></span></button>
    <h1 id="preTitle"></h1>

    <div style="margin-top:10px"><button class="btn" id="preSecond"></button></div>
    <div id="preNote" class="plate warn sec" hidden></div>
  </section>

  <!-- ===== stage (shared by all exercises) ===== -->
  <section id="scr-stage" hidden>
    <div class="stageWrap">

<script>
'use strict';
/* ================= 4. Pure logic (DOM-free) ================= */
const SCHEMA = 2;
const $ = id => document.getElementById(id);
const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
const pad = n => String(n).padStart(2, '0');
const rnd = n => Math.floor(Math.random() * n);
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function newId() {
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6);
}
const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const monthKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };

/* --- migration v1 -> v2 --- */
function migrateV1(old) {
  const records = [], sidMap = new Map();
  (old.attempts || []).forEach(a => {
    const id = newId() + '-' + records.length;
    const r = { id, ts: a.ts, kind: 'schulte', mode: a.mode, size: a.size, t: a.t };
    if (typeof a.err === 'number') r.err = a.err;
    if (Array.isArray(a.presses)) r.presses = a.presses.map(p => [p.p, Math.round(p.dt * 1000)]);
    if (a.sid) { r.sid = a.sid; if (!sidMap.has(a.sid)) sidMap.set(a.sid, []); sidMap.get(a.sid).push(id); }
    records.push(r);
  });
  (old.series || []).forEach(s => {
    records.push({
      id: newId() + '-s' + records.length, ts: s.ts, kind: 'series', mode: s.mode, size: s.size,
      times: s.times, er: s.er, vr: s.vr, pu: s.pu, attemptIds: sidMap.get(s.id) || []
    });
  });
  // point each attempt's sid at the new series id
  records.filter(r => r.kind === 'series').forEach(s => {
    s.attemptIds.forEach(aid => { const a = records.find(r => r.id === aid); if (a) a.sid = s.id; });
  });
  return records;
}
function emptyDB() {
  return { records: [], meta: { schemaVersion: SCHEMA, settings: {}, nback: { n: 2, failStreak: 0, updatedAt: 0 }, tombstones: [] } };
}
function normalizeMeta(m) {
  const d = emptyDB().meta;
  const meta = Object.assign(d, m || {});
  meta.schemaVersion = SCHEMA;
  meta.settings = Object.assign({ updatedAt: 0 }, meta.settings || {});
  meta.nback = Object.assign({ n: 2, failStreak: 0, updatedAt: 0 }, meta.nback || {});
  meta.tombstones = Array.isArray(meta.tombstones) ? meta.tombstones : [];
  return meta;
}

/* --- validation & merge --- */
function parseImport(text) {
  let j;
  try { j = JSON.parse(text); } catch (e) { throw new Error('errJson'); }
  if (!j || typeof j !== 'object') throw new Error('errShape');
  if (j.schema && j.schema > SCHEMA) throw new Error('errNewer');
  if (Array.isArray(j.attempts) || Array.isArray(j.series)) {   // legacy v1 export
    return { records: migrateV1(j), meta: normalizeMeta(null) };
  }
  if (!Array.isArray(j.records)) throw new Error('errShape');
  const ok = j.records.every(r => r && typeof r.id === 'string' && typeof r.ts === 'number' && typeof r.kind === 'string');
  if (!ok) throw new Error('errShape');
  const meta = normalizeMeta(j.meta);
  if (Array.isArray(j.tombstones)) meta.tombstones = j.tombstones;
  return { records: j.records, meta };
}
function mergeDB(L, R) {
  const tomb = new Set([].concat(L.meta.tombstones, R.meta.tombstones));
  const byId = new Map();
  L.records.concat(R.records).forEach(r => { if (!tomb.has(r.id)) byId.set(r.id, r); });
  const newer = (a, b) => ((b && b.updatedAt || 0) > (a && a.updatedAt || 0) ? b : a);
  const meta = normalizeMeta({
    settings: newer(L.meta.settings, R.meta.settings),
    nback: newer(L.meta.nback, R.meta.nback),
    tombstones: [...tomb]
  });
  const added = [...byId.keys()].filter(id => !L.records.some(r => r.id === id)).length;
  return { db: { records: [...byId.values()].sort((a, b) => a.ts - b.ts), meta }, added };
}

/* --- dual n-back: generation, scoring, level --- */
const NB_TRIAL_MS = 3000;
const NB_LETTERS = {
  ru: ['А', 'И', 'О', 'У', 'Ж', 'К', 'Ш', 'Р'],
  en: ['C', 'H', 'K', 'L', 'Q', 'R', 'S', 'T']

function streakDays() {
  const d = dayCounts(60);
  let s = 0;
  for (let i = d.length - 1; i >= 0; i--) {
    if (d[i].n > 0) s++;
    else if (i !== d.length - 1) break;      // today may still be empty
    else continue;
  }
  return s;
}

/* ================= Widgets ================= */
function sparkline(vals, w, h, invert) {
  const svg = svgEl('svg', { viewBox: '0 0 ' + w + ' ' + h, width: w, height: h });
  if (vals.length < 2) return svg;
  const lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  const span = hi - lo || 1;
  const pt = (v, i) => {
    const x = i / (vals.length - 1) * (w - 2) + 1;
    const norm = (v - lo) / span;
    const y = (invert ? norm : 1 - norm) * (h - 6) + 3;
    return x.toFixed(1) + ' ' + y.toFixed(1);
  };
  svg.append(svgEl('path', {
    d: 'M' + vals.map(pt).join(' L'), fill: 'none',
    stroke: cssVar('--accent'), 'stroke-width': 1.6, 'stroke-linejoin': 'round', 'stroke-linecap': 'round'
  }));
  svg.append(svgEl('line', { x1: 1, x2: w - 1, y1: h - 1, y2: h - 1, stroke: cssVar('--hairline'), 'stroke-width': 1 }));
  return svg;
}
function pauseBars(presses, labelFor) {
  const wrap = el('div');
  const dts = presses.map(p => p[1] / 1000);
  let mi = 0;
  dts.forEach((d, i) => { if (d > dts[mi]) mi = i; });
  const hi = dts[mi] || 1;
  const bars = el('div', 'bars');
  dts.forEach((d, i) => {
    const b = el('i');
    b.style.height = Math.max(2, Math.round(d / hi * 90)) + 'px';
    if (i === mi) b.className = 'max';
    b.title = labelFor(i) + ' · ' + fmtSU(d);
    bars.append(b);
  });
  const axis = el('div', 'barsAxis');
  axis.append(el('span', null, labelFor(0)), el('span', null, labelFor(Math.floor(dts.length / 2))), el('span', null, labelFor(dts.length - 1)));
  wrap.append(bars, axis);
  const note = el('p', 'note', t('pauseNote')(labelFor(mi), fmtSU(dts[mi])));
  note.style.marginTop = '8px';
  wrap.append(note);
  return wrap;
}

  const box = $('homeRecord');
  box.replaceChildren();

  const rec = el('div', 'record');
  if (!kind) {
    rec.append(el('p', 'note', t('noRecord')));
  } else if (kind === 'nback') {
    const rs = recs('nback');
    rec.append(el('span', 'cap', t('bestCap')(exName('nback'), '')));
    const top = el('div', 'recordTop');
    const v = el('div', 'recordVal', String(Math.max.apply(null, rs.map(r => r.n))));
    top.append(v);
    const sp = el('div', 'spark');
    sp.append(sparkline(rs.slice(-14).map(r => r.n), 120, 34, false));
    top.append(sp);
    rec.append(top);
    rec.append(el('div', 'recordDelta', t('kpiLevel') + ' ' + DB.meta.nback.n));
  } else {
    const rs = recs(kind);
    const det = kind === 'schulte' ? (rs[rs.length - 1].size + '×' + rs[rs.length - 1].size) : '7×7';
    rec.append(el('span', 'cap', t('bestCap')(exName(kind), det)));
    const top = el('div', 'recordTop');
    const v = el('div', 'recordVal');
    v.append(fmtS(Math.min.apply(null, rs.map(r => r.t))));
    v.append(el('span', 'u', t('unit').trim()));
    top.append(v);
    const sp = el('div', 'spark');
    sp.append(sparkline(rs.slice(-14).map(r => r.t), 120, 34, true));
    top.append(sp);
    rec.append(top);
    if (rs.length >= 6) {
      const last5 = rs.slice(-5).map(r => r.t), prev = rs.slice(-10, -5).map(r => r.t);
      if (prev.length) {
        const d = mean(last5) - mean(prev);
        const dl = el('div', 'recordDelta ' + (d <= 0 ? 'down' : 'up'),
          (d <= 0 ? '−' : '+') + t('vsPrev5')(fmtSU(Math.abs(d))));
        rec.append(dl);
      }
    }
  }
  box.append(rec);

  /* exercise rows */
  const list = $('homeEx');
  list.replaceChildren();
  EXES.forEach(ex => {
    const b = el('button', 'exRow row');
    b.append(exIcon(ex));
    const g = el('div', 'grow');
    g.append(el('div', 'rowMain', exName(ex)), el('div', 'rowSub', exWhat(ex)));
    b.append(g);
    let val = t('notStarted');
    if (ex === 'nback') { if (recs('nback').length) val = t('levelIs')(DB.meta.nback.n); }
    else { const bs = bestOf(ex); if (bs !== null) val = fmtSU(bs); }
    b.append(el('div', 'rowVal', val));
    b.addEventListener('click', () => { EX = ex; go('pre'); });
    list.append(b);
  });

  /* day map */
  const days = dayCounts(14);
  const dm = $('homeDays');
  dm.replaceChildren();
  const maxN = Math.max(1, Math.max.apply(null, days.map(d => d.n)));
  days.forEach(d => {
    const i = el('i');
    if (d.n) i.style.background = accentA(0.25 + 0.75 * (d.n / maxN));
    i.title = d.key + ' · ' + d.n;
    dm.append(i);
  });
  const st = streakDays();
  $('homeStreak').textContent = st > 1 ? t('streak')(st) : '';
  $('homeDaysNote').textContent = t('daysNote')(days[days.length - 1].n);
}

/* ================= Schulte ================= */
const Sch = {
  run: null, series: null,
  begin() { EX = 'schulte'; go('stage'); stageReset(); countdown(() => this.start()); },
  start() {
    const size = S().size || 5, mode = S().mode || 'click', n = size * size;
    const order = shuffle(Array.from({ length: n }, (_, i) => i + 1));
    this.run = { size, mode, next: 1, errors: 0, presses: [], t0: performance.now(), tPrev: performance.now() };
    EX = 'schulte';
    go('stage');
    stageReset();
    const chip = el('div', 'targetChip', '1');
    const meter = tableStageHead(chip, mode === 'click');
    this.chip = chip;
    this.timer = meter.firstElementChild;
    this.errBox = mode === 'click' ? meter.lastElementChild : null;
    if (mode === 'gaze') {
      $('stageHead').firstElementChild.replaceChildren(el('span', 'cap', t('findGaze')));
    }
    const wrap = el('div', 'gridWrap');
    const grid = el('div', 'tblGrid');
    grid.id = 'grid';
    grid.dataset.size = size;
    grid.style.gridTemplateColumns = 'repeat(' + size + ', 1fr)';
    order.forEach((num, idx) => {
      const b = el('button', null, String(num));
      b.dataset.n = num; b.dataset.p = idx;
      grid.append(b);
    });
    grid.addEventListener('click', e => this.press(e));
    wrap.append(grid);
    $('stageBody').append(wrap);
    if (mode === 'gaze') {
      const fin = el('button', 'btn primary', t('gazeFinish'));
      fin.style.marginTop = '4px';
      fin.addEventListener('click', () => this.finish(performance.now()));
      $('stageExtra').append(fin);
    }
    $('stageCount').textContent = this.series ? t('seriesOf')(this.series.times.length + 1) : t('foundOf')(0, n);
    this.tick = setInterval(() => { this.timer.textContent = fmtClock((performance.now() - this.run.t0) / 1000); }, 100);
  },
  press(e) {
    const b = e.target.closest('button');
    if (!b || !this.run || this.run.mode !== 'click') return;
    const now = performance.now(), n = this.run.size * this.run.size;
    if (+b.dataset.n === this.run.next) {
      this.run.presses.push([+b.dataset.p, Math.round(now - this.run.tPrev)]);
      this.run.tPrev = now; this.run.next++;
      // confirm the press, but leave no trace: a lasting mark would map out the
      // already-searched cells and take the load off peripheral vision
      b.classList.add('ok');
      setTimeout(() => b.classList.remove('ok'), 140);
      Haptics.tick();
      if (this.run.next > n) { this.finish(now); return; }
      this.chip.textContent = this.run.next;
      stageProgress((this.run.next - 1) / n);
      if (!this.series) $('stageCount').textContent = t('foundOf')(this.run.next - 1, n);
    } else {
      this.run.errors++;
      if (this.errBox) this.errBox.textContent = t('errorsCap') + ' ' + this.run.errors;
      errorBeep(); Haptics.error();
      b.classList.add('bad');
      setTimeout(() => b.classList.remove('bad'), 260);
    }
  },
  finish(now) {
    clearInterval(this.tick);
    const r = this.run;
    const rec = { id: newId(), ts: Date.now(), kind: 'schulte', mode: r.mode, size: r.size, t: +((now - r.t0) / 1000).toFixed(2) };
    if (r.mode === 'click') { rec.err = r.errors; rec.presses = r.presses; }
    let series = null;
    if (this.series) {
      this.series.times.push(rec.t); this.series.ids.push(rec.id);
      if (this.series.times.length === 5) {
        const T = this.series.times, er = mean(T);
        series = {
          id: newId(), ts: Date.now(), kind: 'series', mode: rec.mode, size: rec.size,
          times: T.map(x => +x.toFixed(2)), er: +er.toFixed(2),
          vr: er > 0 ? +(T[0] / er).toFixed(2) : 0, pu: er > 0 ? +(T[3] / er).toFixed(2) : 0,
          attemptIds: this.series.ids.slice()
        };
        rec.sid = series.id;
        this.series.ids.forEach(aid => { const a = DB.records.find(x => x.id === aid); if (a && !a.sid) { a.sid = series.id; ADP.putRecord(a); } });
      }
    }
    this.run = null;
    addRecord(rec);
    if (series) addRecord(series);
    showResult(rec, series);
  },
  abort() { if (this.run) { clearInterval(this.tick); this.run = null; } }
};

/* ================= Gorbov–Schulte ================= */
const Gor = {
  run: null,
  begin() { EX = 'gorbov'; go('stage'); stageReset(); countdown(() => this.start()); },
  start() {
    const cells = genGorbov();
    this.run = { cells, step: 0, errors: 0, presses: [], t0: performance.now(), tPrev: performance.now() };
    EX = 'gorbov';
    go('stage');
    stageReset();
    const chip = el('div', 'targetChip');
    const meter = tableStageHead(chip, true);
    this.chip = chip;
    this.timer = meter.firstElementChild;
    this.errBox = meter.lastElementChild;
    const wrap = el('div', 'gridWrap gorbovWrap');
    const grid = el('div', 'tblGrid');
    grid.id = 'gGrid';
    grid.dataset.size = 7;
    grid.style.gridTemplateColumns = 'repeat(7, 1fr)';
    cells.forEach((c, idx) => {
      const b = el('button', c.red ? 'redCell' : null, String(c.n));
      b.dataset.p = idx;
      grid.append(b);
    });
    grid.addEventListener('click', e => this.press(e));
    wrap.append(grid);
    $('stageBody').append(wrap);
    const seqLine = el('p', 'cap seqLine', t('seqHint'));
    seqLine.style.textAlign = 'center';
    seqLine.style.margin = '14px 0 12px';
    $('stageExtra').append(seqLine);
    const logCap = el('span', 'cap stageExtraCap', t('capSwitches'));
    logCap.style.display = 'block';
    logCap.style.marginBottom = '8px';
    this.log = el('div', 'swLog');
    $('stageExtra').append(logCap, this.log);
    this.target();
    $('stageCount').textContent = t('moveOf')(1, GORBOV_STEPS);
    this.tick = setInterval(() => { this.timer.textContent = fmtClock((performance.now() - this.run.t0) / 1000); }, 100);
  },
  target() {
    const tg = gorbovTarget(this.run.step);
    this.chip.textContent = (tg.red ? t('gRed') : t('gBlack')) + tg.n;
    this.chip.classList.toggle('red', tg.red);
  },
  press(e) {
    const b = e.target.closest('button');
    if (!b || !this.run) return;
    const cell = this.run.cells[+b.dataset.p], tg = gorbovTarget(this.run.step), now = performance.now();
    if (cell.n === tg.n && cell.red === tg.red) {
      const dt = Math.round(now - this.run.tPrev);
      this.run.presses.push([+b.dataset.p, dt]);
      this.run.tPrev = now;
      b.classList.add('ok');
      setTimeout(() => b.classList.remove('ok'), 140);
      Haptics.tick();
      const entry = el('div', tg.red ? 'red' : null);
      entry.append(el('span', null, (tg.red ? t('gRed') : t('gBlack')) + tg.n), el('em', null, fmtS(dt / 1000)));
      this.log.prepend(entry);
      while (this.log.children.length > 6) this.log.lastElementChild.remove();
      this.run.step++;
      stageProgress(this.run.step / GORBOV_STEPS);
      if (this.run.step >= GORBOV_STEPS) { this.finish(now); return; }
      this.target();
      $('stageCount').textContent = t('moveOf')(this.run.step + 1, GORBOV_STEPS);
    } else {
      this.run.errors++;
      this.errBox.textContent = t('errorsCap') + ' ' + this.run.errors;
      errorBeep(); Haptics.error();
      b.classList.add('bad');
      setTimeout(() => b.classList.remove('bad'), 260);
    }
  },
  finish(now) {
    clearInterval(this.tick);
    const r = this.run;
    this.run = null;
    const rec = {
      id: newId(), ts: Date.now(), kind: 'gorbov',
      t: +((now - r.t0) / 1000).toFixed(2), err: r.errors, presses: r.presses
    };
    addRecord(rec);
    showResult(rec, null);
  },
  abort() { if (this.run) { clearInterval(this.tick); this.run = null; } }
};

/* ================= Dual n-back ================= */
const Speech = {
  voices: [],
  load() { try { this.voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; } catch (e) { this.voices = []; } },
  available() { return !!window.speechSynthesis; },
  voiceFor(set) {
    const pre = set === 'ru' ? 'ru' : 'en';
    const m = this.voices.filter(v => (v.lang || '').toLowerCase().indexOf(pre) === 0);
    return m.find(v => v.localService) || m[0] || null;
  },
  say(text, set) {
    if (!this.available()) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const v = this.voiceFor(set);
      if (v) { u.voice = v; u.lang = v.lang; } else u.lang = set === 'ru' ? 'ru-RU' : 'en-US';
      speechSynthesis.speak(u);
    } catch (e) { console.warn('speak failed', e); }
  }
};
if (window.speechSynthesis) {
  Speech.load();
  speechSynthesis.onvoiceschanged = () => { Speech.load(); if (SCREEN === 'pre' && EX === 'nback') nbCheckVoice(); };
}
function nbSet() { return S().nbSet || LANG; }
function nbCheckVoice() {
  const note = $('preNote');
  note.replaceChildren(); note.hidden = true;
  $('preStart').disabled = false;
  if (!Speech.available() || !Speech.voices.length) {
    note.textContent = t('nbNoVoice'); note.hidden = false;
    $('preStart').disabled = true;
    return false;
  }
  const set = nbSet();
  if (!Speech.voiceFor(set)) {
    const other = set === 'ru' ? 'en' : 'ru';
    if (Speech.voiceFor(other)) {
      note.append(t('nbNoVoiceSet') + ' ');
      const b = el('button', 'btn sm', t('nbSwitchSet'));

const Nb = {
  run: null,

  },
  start() {
    const n = DB.meta.nback.n, set = nbSet();
    const trials = genNback(n, set);
    this.run = { trials, set, idx: -1, ansPos: [], ansAud: [] };
    EX = 'nback';

    head.append(meter);
    this.meter = meter.firstElementChild;

    $('stageBody').append(grid);

    const mk = (label, key, ch) => {
      const b = el('button');
      b.append(el('span', 't', label), el('span', 'k', key));
      b.addEventListener('click', () => this.answer(ch));
      return b;
    };
    this.bPos = mk(t('nbPos'), 'A', 'pos');
    this.bAud = mk(t('nbAud'), 'L', 'aud');
    ans.append(this.bPos, this.bAud);
    $('stageExtra').append(ans);
    $('stageCount').textContent = t('trialOf')(1, trials.count);
    this.step();
    this.tick = setInterval(() => this.step(), NB_TRIAL_MS);
  },
  step() {
    const r = this.run;
    if (!r) return;
    r.idx++;
    if (r.idx >= r.trials.count) { this.finish(); return; }
    const cells = $('nbGrid').children;
    [...cells].forEach(c => c.classList.remove('on'));
    cells[r.trials.pos[r.idx]].classList.add('on');
    Speech.say(NB_LETTERS[r.set][r.trials.aud[r.idx]], r.set);
    this.bPos.className = ''; this.bAud.className = '';
    this.meter.textContent = (r.idx + 1) + '/' + r.trials.count;
    $('stageCount').textContent = t('trialOf')(r.idx + 1, r.trials.count);
    stageProgress((r.idx + 1) / r.trials.count);
    setTimeout(() => {
      if (this.run === r && r.idx < r.trials.count) [...$('nbGrid').children].forEach(c => c.classList.remove('on'));
    }, NB_TRIAL_MS - 700);
  },
  answer(ch) {
    const r = this.run;
    if (!r || r.idx < 0) return;
    const arr = ch === 'pos' ? r.ansPos : r.ansAud;
    if (arr[r.idx]) return;
    arr[r.idx] = true;
    const seq = ch === 'pos' ? r.trials.pos : r.trials.aud;
    const isMatch = r.idx >= r.trials.n && seq[r.idx] === seq[r.idx - r.trials.n];
    const btn = ch === 'pos' ? this.bPos : this.bAud;
    btn.className = isMatch ? 'hit' : 'fa';
    btn.lastElementChild.textContent = isMatch ? t('nbMatched') : (ch === 'pos' ? 'A' : 'L');
    if (isMatch) Haptics.hit(); else { errorBeep(); Haptics.error(); }
  },
  finish() {
    const r = this.run;
    clearInterval(this.tick);
    if (window.speechSynthesis) speechSynthesis.cancel();
    this.run = null;
    const sc = scoreSession(r.trials, r.ansPos, r.ansAud);
    const rec = {
      id: newId(), ts: Date.now(), kind: 'nback', n: r.trials.n, trials: r.trials.count,
      pos: sc.pos, aud: sc.aud, pct: sc.pct, set: r.set
    };
    addRecord(rec);
    const nxt = nextLevel(r.trials.n, DB.meta.nback.failStreak, sc.pct);
    saveNbackState(nxt.n, nxt.failStreak);
    showResult(rec, null, nxt);
  },
  abort() {
    if (this.run) { clearInterval(this.tick); this.run = null; }
    if (window.speechSynthesis) speechSynthesis.cancel();
  }
};

/* point the statistics filters at what was just practised, so the screen never

function focusStatsOn(rec) {
  const patch = { fEx: rec.kind };

function showResult(rec, series, lvl) {
  const isNb = rec.kind === 'nback';
  focusStatsOn(rec);
  if (lvl && lvl.change === 'down') Haptics.warning(); else Haptics.success();
  const det = rec.kind === 'schulte' ? rec.size + '×' + rec.size + ' · ' + t(rec.mode === 'click' ? 'modeClick' : 'modeGaze')
    : rec.kind === 'gorbov' ? '7×7' : 'N = ' + rec.n;
  $('resCap').textContent = exName(rec.kind) + ' · ' + det;

  const hero = $('resHero');
  hero.replaceChildren();
  if (isNb) { hero.append(String(rec.pct)); hero.append(el('span', 'u', '%')); }
  else { hero.append(fmtS(rec.t)); hero.append(el('span', 'u', t('unit').trim())); }

  /* delta plate */
  const box = $('resDelta');
  box.replaceChildren();
  const same = DB.records.filter(r => r.kind === rec.kind && r.id !== rec.id &&
    (rec.kind !== 'schulte' || (r.size === rec.size && r.mode === rec.mode)));
  if (!isNb && same.length >= 3) {
    const prev = same.slice(-5).map(r => r.t);
    const d = rec.t - mean(prev);
    const best = Math.min.apply(null, same.map(r => r.t));
    const parts = [(d <= 0 ? '−' : '+') + t('vsPrev5')(fmtSU(Math.abs(d)))];
    if (rec.t < best) parts.push(t('personalBest'));
    box.append(el('div', 'plate mono ' + (d <= 0 ? 'good' : ''), parts.join(' · ')));
  } else if (isNb && lvl) {
    const cls = lvl.change === 'up' ? 'good' : lvl.change === 'down' ? 'warn' : '';
    const txt = lvl.change === 'up' ? t('nbLvlUp')(lvl.n) : lvl.change === 'down' ? t('nbLvlDown')(lvl.n) : t('nbLvlSame')(lvl.n);
    box.append(el('div', 'plate mono ' + cls, txt));
  } else if (rec.mode === 'gaze') {
    box.append(el('div', 'plate', t('resGaze')));
  }

  /* metrics */
  const m = $('resMetrics');
  m.replaceChildren();
  const metric = (cap, val, unit) => {
    const d = el('div');
    d.append(el('div', 'cap', cap));
    const v = el('div', 'v', val);

    d.append(v);
    return d;
  };
  const detail = $('resDetail');

    m.append(metric(t('nbPos'), ch(rec.pos)), metric(t('nbAud'), ch(rec.aud)),
      metric(t('nbFa'), String(rec.pos.fa + rec.aud.fa)));
  } else if (rec.presses && rec.presses.length) {
    const dts = rec.presses.map(p => p[1] / 1000);
    let mi = 0;
    dts.forEach((d, i) => { if (d > dts[mi]) mi = i; });
    const labelFor = i => rec.kind === 'gorbov'
      ? (gorbovTarget(i).red ? t('gRed') : t('gBlack')) + gorbovTarget(i).n
      : String(i + 1);
    m.append(metric(t('errorsCap'), String(rec.err)), metric(t('resAvgInt'), fmtS(mean(dts)), t('unit').trim()),
      metric(t('resLongest'), labelFor(mi)));
    const cap = el('span', 'cap', t('capPauses'));
    cap.style.display = 'block';
    cap.style.marginBottom = '10px';
    detail.append(cap, pauseBars(rec.presses, labelFor));
  } else {
    m.append(metric(t('thTime'), fmtS(rec.t), t('unit').trim()));
  }

  /* series summary */
  if (series) {
    const cap = el('span', 'cap', t('capSeries'));
    cap.style.display = 'block';
    cap.style.margin = '22px 0 8px';
    const row = el('div', 'metrics');
    [[t('thER'), fmtS(series.er), t('unit').trim()], [t('thVR'), fmtS(series.vr) + (series.vr <= 1 ? ' ✓' : ''), ''], [t('thPU'), fmtS(series.pu) + (series.pu <= 1 ? ' ✓' : ''), '']]
      .forEach(p => row.append(metric(p[0], p[1], p[2])));
    detail.append(cap, row);
    Sch.series = null;
  }

  $('resAgain').textContent = Sch.series ? t('seriesOf')(Sch.series.times.length + 1) : t('again');
  const acts = $('resActions');
  acts.replaceChildren();
  if (!Sch.series && rec.kind === 'schulte') {
    const b = el('button', 'btn', t('series5'));
    b.addEventListener('click', () => { Sch.series = { times: [], ids: [] }; Sch.begin(); });
    acts.append(b);
  }
  const st = el('button', 'btn', t('stats'));
  st.addEventListener('click', () => go('stats'));
  const home = el('button', 'btn', t('back'));
  home.addEventListener('click', () => go('home'));
  acts.append(st, home);
  go('result');
  renderHome();
}

document.addEventListener('keydown', e => {
  if (Nb.run) {
    if (e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф') { e.preventDefault(); Nb.answer('pos'); }
    else if (e.key === 'l' || e.key === 'L' || e.key === 'д' || e.key === 'Д') { e.preventDefault(); Nb.answer('aud'); }
    else if (e.key === 'Escape') { Nb.abort(); go('pre'); }
    return;
  }
  if (e.code === 'Space') {
    if (Sch.run && Sch.run.mode === 'gaze') { e.preventDefault(); Sch.finish(performance.now()); }
    else if (SCREEN === 'result') { e.preventDefault(); $('resAgain').click(); }
    else if (SCREEN === 'pre') { e.preventDefault(); $('preStart').click(); }
  } else if (e.key === 'Escape') {
    if (SCREEN === 'stage') { abortAll(); go('pre'); }
    else if (SCREEN === 'result') go('home');
  } else if (SCREEN === 'pre' && EX === 'schulte' && '456'.indexOf(e.key) >= 0) {
    saveSettings({ size: +e.key }); renderPre();
  }
});

function renderChart(F, ex) {
  const box = $('chartBox'), axis = $('chartAxis');
  box.replaceChildren(); axis.replaceChildren();
  const isLvl = ex === 'nback';
  const byDay = new Map();
  F.forEach(r => {
    const k = dayKey(r.ts);
    if (!byDay.has(k)) byDay.set(k, { ts: r.ts, vals: [] });
    byDay.get(k).vals.push(isLvl ? r.n : r.t);
  });
  const days = [...byDay.values()].sort((a, b) => a.ts - b.ts).slice(-30).map(d => ({ ts: d.ts, avg: mean(d.vals), n: d.vals.length }));
  if (!days.length) { box.append(el('div', 'empty', t('chartEmpty'))); return; }
  const W = 600, H = 150, P = 6;
  const lo = Math.min.apply(null, days.map(d => d.avg)), hi = Math.max.apply(null, days.map(d => d.avg));
  const span = (hi - lo) || 1;
  const X = i => days.length === 1 ? W / 2 : P + i / (days.length - 1) * (W - P * 2);
  const Y = v => P + (1 - (v - lo) / span) * (H - P * 2 - 10);
  const svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'none' });
  svg.style.height = '150px';
  const pts = days.map((d, i) => X(i).toFixed(1) + ' ' + Y(d.avg).toFixed(1));
  if (days.length > 1) {
    svg.append(svgEl('path', {
      d: 'M' + pts.join(' L') + ' L' + X(days.length - 1).toFixed(1) + ' ' + (H - 8) + ' L' + X(0).toFixed(1) + ' ' + (H - 8) + ' Z',
      fill: accentA(0.10), stroke: 'none'
    }));
    svg.append(svgEl('path', { d: 'M' + pts.join(' L'), fill: 'none', stroke: cssVar('--accent'), 'stroke-width': 1.8, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
  }
  svg.append(svgEl('line', { x1: 0, x2: W, y1: H - 8, y2: H - 8, stroke: cssVar('--rule'), 'stroke-width': 1 }));
  const last = days[days.length - 1];
  svg.append(svgEl('circle', { cx: X(days.length - 1), cy: Y(last.avg), r: 3.4, fill: cssVar('--accent') }));
  box.append(svg);
  axis.append(el('span', null, fmtDay(days[0].ts)), el('span', null, fmtDay(last.ts) + ' · ' + (isLvl ? fmtS(last.avg) : fmtSU(last.avg))));
}

function renderHeat(F, ex) {

  $('heatHint').textContent = t('heatHint');
  const n = size * size, sum = new Array(n).fill(0), cnt = new Array(n).fill(0);

  const avg = sum.map((s, i) => cnt[i] ? s / cnt[i] : null);
  const vals = avg.filter(v => v !== null);

    await navigator.clipboard.writeText(exportPayload());
    rep.textContent = t('copied'); rep.className = 'plate'; rep.hidden = false;
  } catch (e) { rep.textContent = String(e); rep.className = 'plate warn'; rep.hidden = false; }
});
$('btnImport').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const rep = $('importReport');
  try {
    const incoming = parseImport(await file.text());
    const before = DB.records.length;
    const res = mergeDB(DB, incoming);
    ADP.replaceAll(res.db); DB = res.db;
    const added = DB.records.length - before;
    rep.textContent = t('importOk')(added, incoming.records.length - added);
    rep.className = 'plate'; rep.hidden = false;
    renderStats(); renderHome();
  } catch (err) {
    const key = err && err.message && STR[LANG][err.message] ? err.message : 'errShape';
    rep.textContent = t('importErr')(t(key));
    rep.className = 'plate warn'; rep.hidden = false;
  }
});
$('btnWipe').addEventListener('click', () => {
  armButton($('btnWipe'), {
    arm: b => { b.textContent = t('wipeConfirm'); },
    disarm: b => { b.textContent = t('wipe'); }
  }, () => {
    const fresh = emptyDB();
    fresh.meta.settings = Object.assign({}, DB.meta.settings, { updatedAt: Date.now() });
    ADP.replaceAll(fresh); DB = fresh;
    $('btnWipe').textContent = t('wipe');
    renderStats(); renderHome();
  });
});

/* ================= Boot ================= */
async function boot() {
  const tg = isTelegram();
  if (TG) { try { TG.ready(); TG.expand(); } catch (e) {} }
  ADP = tg ? CloudAdapter() : LocalAdapter();
  try { DB = await ADP.init(); } catch (e) { console.warn('init failed', e); DB = emptyDB(); }
  DB.meta = normalizeMeta(DB.meta);
  LANG = S().lang || ((navigator.language || 'ru').toLowerCase().indexOf('ru') === 0 ? 'ru' : 'en');
  if (TG && TG.colorScheme) {
    document.documentElement.dataset.theme = TG.colorScheme;
    if (TG.onEvent) TG.onEvent('themeChanged', () => {
      document.documentElement.dataset.theme = TG.colorScheme;
      if (SCREEN === 'stats') renderStats();
      if (SCREEN === 'home') renderHome();
    });
  }
  const langSeg = $('segLang');
  [...langSeg.children].forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.v === LANG));
    b.addEventListener('click', () => {
      LANG = b.dataset.v;
      [...langSeg.children].forEach(c => c.setAttribute('aria-pressed', String(c === b)));
      saveSettings({ lang: LANG });
      applyLang();
    });
  });
  $('loading').hidden = true;
  applyLang();
  go('home');
}
boot();

</script>
