<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<title>FocusTrack</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔢</text></svg>">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ========== 1. Design tokens & themes ========== */
:root {
  color-scheme: light;
  --bg: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink2: #52514e;
  --muted: #898781;
  --hairline: #e1e0d9;
  --baseline: #c3c2b7;
  --border: rgba(11,11,11,.10);
  --accent: #2a78d6;
  --accent-soft: rgba(42,120,214,.14);
  --good: #006300;
  --good-soft: rgba(12,163,12,.16);
  --crit: #d03b3b;
  --crit-soft: rgba(208,59,59,.22);
  --fs-micro: 0.8rem;
  --fs-h2: 1.25rem;
  --fs-h1: 2rem;
  --fs-hero: 3.25rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink2: #c3c2b7;
    --muted: #898781;
    --hairline: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,.10);
    --accent: #3987e5;
    --accent-soft: rgba(57,135,229,.20);
    --good: #0ca30c;
    --good-soft: rgba(12,163,12,.22);
    --crit: #d03b3b;
    --crit-soft: rgba(208,59,59,.30);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d0d0d;
  --surface: #1a1a19;
  --ink: #ffffff;
  --ink2: #c3c2b7;
  --muted: #898781;
  --hairline: #2c2c2a;
  --baseline: #383835;
  --border: rgba(255,255,255,.10);
  --accent: #3987e5;
  --accent-soft: rgba(57,135,229,.20);
  --good: #0ca30c;
  --good-soft: rgba(12,163,12,.22);
  --crit: #d03b3b;
  --crit-soft: rgba(208,59,59,.30);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
::selection { background: var(--accent-soft); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
* { scrollbar-width: thin; scrollbar-color: var(--baseline) transparent; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
button { touch-action: manipulation; font-family: inherit; }
main { max-width: 940px; margin: 0 auto; padding: 16px 16px 60px; }
header.top {
  max-width: 940px; margin: 0 auto; padding: 14px 16px 0;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap;
}
.brand { cursor: pointer; border: 0; background: none; padding: 0; text-align: left; color: inherit; }
.brand h1 { font-size: var(--fs-h1); margin: 0; letter-spacing: -0.02em; line-height: 1.1; }
.brand .sub { color: var(--ink2); margin: 1px 0 0; font-size: var(--fs-micro); }
.topRight { display: flex; gap: 10px; align-items: center; margin-left: auto; }
.badge {
  font-size: var(--fs-micro); color: var(--ink2); border: 1px solid var(--border);
  border-radius: 999px; padding: 3px 10px; display: inline-flex; align-items: center; gap: 6px;
  white-space: nowrap;
}
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.iconBtn {
  border: 1px solid var(--border); background: transparent; color: var(--ink2);
  border-radius: 9px; width: 34px; height: 34px; padding: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.iconBtn:hover { background: var(--accent-soft); color: var(--ink); }
.iconBtn svg { width: 18px; height: 18px; }
.iconBtn .fsIn { display: none; }
body.fs .iconBtn .fsOut { display: none; }
body.fs .iconBtn .fsIn { display: block; }
body.tgfs header.top { padding-top: 62px; }
.badge.cloud .dot { background: var(--accent); }
.badge.err .dot { background: var(--crit); }
h2 { font-size: var(--fs-h2); margin: 0 0 10px; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 14px;
}
.hint { color: var(--muted); font-size: var(--fs-micro); margin: 8px 0 0; }
.empty { color: var(--muted); padding: 14px 0; text-align: center; }
.note {
  border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
  color: var(--ink2); margin: 10px 0;
}
.note.warn { border-color: var(--crit); }
/* ---------- controls ---------- */
.controls { display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: center; }
.ctl { display: flex; align-items: center; gap: 8px; }
.ctl > .lbl { font-size: var(--fs-micro); color: var(--ink2); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
.seg button {
  border: 0; background: transparent; color: var(--ink2);
  padding: 8px 14px; cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.chk { display: flex; align-items: center; gap: 6px; color: var(--ink2); cursor: pointer; }
.chk input { accent-color: var(--accent); }
button.primary, button.ghost {
  cursor: pointer; border-radius: 10px; padding: 9px 18px; min-height: 42px; font-size: 1rem;
}
button.primary { background: var(--accent); color: #fff; border: 1px solid transparent; font-weight: 600; }
button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--border); }
button.primary:hover { filter: brightness(1.06); }
button.ghost:hover { background: var(--accent-soft); }
button:disabled { opacity: .45; cursor: default; }
.backRow { margin: 2px 0 10px; }
.backRow button { border: 0; background: none; color: var(--ink2); cursor: pointer; padding: 6px 8px 6px 0; }
.backRow button:hover { color: var(--ink); }
/* ---------- home ---------- */
.exList { display: flex; flex-direction: column; gap: 10px; margin: 4px 0 14px; }
.exItem {
  display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 4px 14px;
  text-align: left; background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; cursor: pointer;
}
.exItem:hover { background: var(--accent-soft); }
.exItem svg { grid-row: span 2; width: 40px; height: 40px; color: var(--accent); }
.exItem .exName { font-weight: 650; font-size: var(--fs-h2); }
.exItem .exWhat { grid-column: 2; color: var(--ink2); font-size: var(--fs-micro); }
.exItem .exHint { grid-row: span 2; color: var(--muted); font-size: var(--fs-micro); font-variant-numeric: tabular-nums; text-align: right; }
/* ---------- stage (shared by the table exercises) ---------- */
#hud, #gHud { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 12px; min-height: 28px; margin-bottom: 10px; flex-wrap: wrap; }
.hudLeft { color: var(--ink2); }
.hudLeft b { color: var(--ink); font-size: var(--fs-h2); }
.hudRight { display: flex; gap: 16px; align-items: baseline; margin-left: auto; }
.hudTimer { font-variant-numeric: tabular-nums; color: var(--ink2); }
.hudErr { color: var(--ink2); font-size: var(--fs-micro); }
.gridWrap { position: relative; width: min(100%, 520px, 58vh); margin: 0 auto; }
.tblGrid { display: grid; gap: 6px; width: 100%; }
.tblGrid button {
  aspect-ratio: 1; border: 1px solid var(--hairline); border-radius: 9px;
  background: var(--surface); color: var(--ink);
  font-weight: 600; cursor: pointer;
  user-select: none; -webkit-user-select: none; padding: 0;
  transition: background .08s;
}
.tblGrid[data-size="4"] button { font-size: clamp(20px, 7vmin, 34px); }
.tblGrid[data-size="5"] button { font-size: clamp(17px, 5.6vmin, 28px); }
.tblGrid[data-size="6"] button { font-size: clamp(14px, 4.6vmin, 23px); }
.tblGrid[data-size="7"] button { font-size: clamp(12px, 3.9vmin, 20px); border-radius: 7px; }
.tblGrid button.anchorCell { background: var(--hairline); }
.tblGrid button.redCell { background: var(--crit); color: #fff; border-color: transparent; }
.tblGrid button.ok  { background: var(--accent-soft); }
.tblGrid button.bad { background: var(--crit-soft); }
/* on a filled red cell the washes would not read, so the feedback becomes a solid fill:
   blue for a correct press, dark for a wrong one */
.tblGrid button.redCell.ok  { background: var(--accent); color: #fff; }
.tblGrid button.redCell.bad { background: var(--ink2); color: var(--surface); }
.anchorDot {
  position: absolute; left: 50%; top: 50%; width: 8px; height: 8px;
  transform: translate(-50%, -50%); border-radius: 50%;
  background: var(--muted); pointer-events: none; display: none;
  box-shadow: 0 0 0 2px var(--surface);
}
.gridWrap.anchored .anchorDot { display: block; }
/* focus mode: while an exercise runs the chrome collapses, so the grid fits a
   small window (Telegram Desktop opens one) without scrolling */
body.running header.top,
body.running .backRow,
body.running #schSettings { display: none; }
body.running main { padding: 10px 16px 16px; }
/* the grid is square, so cap its width by the height left after the fixed chrome */
body.running .gridWrap { width: min(100%, 520px, calc(100vh - 182px)); }
body.running .nbGridWrap { width: min(100%, 340px, calc(100vh - 288px)); }
body.running #segNbSet, body.running #segNbSet + .lbl, body.running .nbTop .ctl { display: none; }
body.running .nbTop { margin-bottom: 8px; }
body.running .nbProgress { margin: 8px 0 2px; }
.stageActions { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
.idlePane p { color: var(--ink2); max-width: 560px; margin: 6px auto 14px; text-align: center; }
.targetChip {
  display: inline-flex; align-items: center; font-weight: 650; font-size: var(--fs-h2);
  border: 1px solid var(--hairline); border-radius: 8px; padding: 1px 12px;
  background: var(--surface); color: var(--ink);
}
.targetChip.red { background: var(--crit); color: #fff; border-color: transparent; }
/* ---------- result ---------- */
.resultPane { text-align: center; }
.hero { font-size: var(--fs-hero); font-weight: 650; margin: 6px 0 2px; line-height: 1.05; letter-spacing: -0.03em; }
.hero small { font-size: var(--fs-h2); font-weight: 500; color: var(--ink2); letter-spacing: 0; }
.resRow { display: flex; gap: 8px 18px; justify-content: center; flex-wrap: wrap; color: var(--ink2); margin-bottom: 6px; }
.resRow b { color: var(--ink); font-weight: 600; }
.seriesDone { margin: 10px 0 4px; }
.seriesDone .tiles { margin-top: 10px; }
.lvlNote { display: inline-block; border-radius: 10px; padding: 6px 14px; margin: 8px 0 2px; font-weight: 600; }
.lvlNote.up { background: var(--good-soft); color: var(--good); }
.lvlNote.down { background: var(--crit-soft); color: var(--crit); }
.lvlNote.same { background: var(--accent-soft); color: var(--ink); }
/* ---------- n-back ---------- */
.nbTop { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; margin-bottom: 12px; }
.lvlPill {
  border: 1px solid var(--border); border-radius: 999px; padding: 6px 16px;
  font-variant-numeric: tabular-nums;
}
.lvlPill b { font-size: var(--fs-h2); }
.nbGridWrap { width: min(100%, 340px, 46vh); margin: 0 auto; }
#nbGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
#nbGrid .nc {
  aspect-ratio: 1; border: 1px solid var(--hairline); border-radius: 12px; background: var(--surface);
  transition: background .12s;
}
#nbGrid .nc.on { background: var(--accent); border-color: var(--accent); }
.nbProgress { text-align: center; color: var(--ink2); margin: 10px 0 4px; font-variant-numeric: tabular-nums; }
.nbAnswers { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
.nbAnswers button {
  flex: 1; max-width: 220px; min-height: 56px; font-size: 1rem; font-weight: 600;
  border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--ink); cursor: pointer;
}
.nbAnswers button:not(:disabled):hover { background: var(--accent-soft); }
.nbAnswers button.hit  { background: var(--good-soft); border-color: var(--good); }
.nbAnswers button.fa   { background: var(--crit-soft); border-color: var(--crit); }
.nbAnswers button kbd {
  font-family: inherit; font-size: var(--fs-micro); color: var(--muted); border: 1px solid var(--hairline);
  border-radius: 5px; padding: 1px 6px; margin-left: 8px; vertical-align: 1px;
}
/* ---------- stats ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
.tile .lbl { font-size: var(--fs-micro); color: var(--ink2); }
.tile .val { font-size: var(--fs-h1); font-weight: 650; margin-top: 2px; letter-spacing: -0.02em; }
.tile .dlt { font-size: var(--fs-micro); margin-top: 2px; }
.dlt.up   { color: var(--crit); }
.dlt.down { color: var(--good); }
#chartBox { position: relative; }
#chartBox svg { width: 100%; height: auto; display: block; }
.tt {
  position: absolute; pointer-events: none; z-index: 5; display: none;
  background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
  padding: 7px 10px; font-size: var(--fs-micro); color: var(--ink2);
  box-shadow: 0 2px 10px rgba(0,0,0,.14); min-width: 120px;
}
.tt .v { color: var(--ink); font-weight: 650; font-size: 1rem; }
#heat { display: grid; gap: 2px; width: min(100%, 420px); margin: 0 auto; }
#heat .hc {
  aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center;
  font-size: var(--fs-micro); font-variant-numeric: tabular-nums; cursor: default;
}
#heat .hc:hover, #heat .hc:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
#heatBox { position: relative; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; color: var(--ink2); font-weight: 500; font-size: var(--fs-micro); padding: 6px 8px; border-bottom: 1px solid var(--baseline); }
td { padding: 6px 8px; border-bottom: 1px solid var(--hairline); font-variant-numeric: tabular-nums; }
td.num, th.num { text-align: right; }
.okmark { color: var(--good); font-weight: 700; }
.tscroll { overflow-x: auto; }
.rowDel {
  border: 1px solid var(--border); background: transparent; color: var(--muted);
  border-radius: 7px; width: 28px; height: 28px; line-height: 1; cursor: pointer;
  font-size: 1rem; padding: 0;
}
.rowDel:hover { color: var(--crit); border-color: var(--crit); }
.rowDel.armed { color: #fff; background: var(--crit); border-color: var(--crit); }
td.delCol, th.delCol { width: 34px; text-align: center; }
.dataRow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
details.help { margin-bottom: 16px; }
details.help summary { cursor: pointer; color: var(--ink2); }
details.help div { color: var(--ink2); padding: 8px 4px 0; max-width: 66ch; }
#loading { text-align: center; color: var(--muted); padding: 60px 0; }
/* ---------- mobile ---------- */
@media (max-width: 480px) {
  main { padding: 10px 10px 44px; }
  header.top { padding: 10px 10px 0; }
  .card { padding: 12px; border-radius: 12px; }
  .brand h1 { font-size: 1.75rem; }
  .controls { gap: 10px 14px; }
  .hero { font-size: 2.5rem; }
  .tile .val { font-size: 1.75rem; }
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .resRow { gap: 6px 12px; }
  .exItem { padding: 12px; grid-template-columns: 36px 1fr auto; }
  .exItem svg { width: 32px; height: 32px; }
}
</style>
</head>
<body>
<header class="top">
  <button class="brand" id="navHome">
    <h1 data-i18n="appTitle">FocusTrack</h1>
    <p class="sub" data-i18n="appSub"></p>
  </button>
  <div class="topRight">
    <button class="iconBtn" id="btnFs" hidden>
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path class="fsOut" d="M7.5 2.5h-5v5M12.5 2.5h5v5M7.5 17.5h-5v-5M12.5 17.5h5v-5"/>
        <path class="fsIn" d="M2.5 7.5h5v-5M17.5 7.5h-5v-5M2.5 12.5h5v5M17.5 12.5h-5v5"/>
      </svg>
    </button>
    <span class="badge" id="storageBadge" hidden><span class="dot"></span><span id="storageBadgeText"></span></span>
    <div class="seg" id="segLang" role="group" aria-label="Language">
      <button data-v="ru" aria-pressed="true">РУС</button>
      <button data-v="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>
<main>
  <div id="loading">…</div>

  <!-- ========== Screen: exercise picker ========== -->
  <section id="scr-home" hidden>
    <nav class="exList">
      <button class="exItem" data-ex="schulte">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="3" width="34" height="34" rx="5"/>
          <path d="M14.3 3v34M25.7 3v34M3 14.3h34M3 25.7h34"/>
        </svg>
        <span class="exName" data-i18n="exSchulte"></span>
        <span class="exWhat" data-i18n="exSchulteWhat"></span>
        <span class="exHint" id="hintSchulte"></span>
      </button>
      <button class="exItem" data-ex="nback">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="3" width="34" height="34" rx="5"/>
          <path d="M14.3 3v34M25.7 3v34M3 14.3h34M3 25.7h34"/>
          <rect x="14.3" y="14.3" width="11.4" height="11.4" fill="currentColor" stroke="none" rx="2"/>
        </svg>
        <span class="exName" data-i18n="exNback"></span>
        <span class="exWhat" data-i18n="exNbackWhat"></span>
        <span class="exHint" id="hintNback"></span>
      </button>
      <button class="exItem" data-ex="gorbov">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="3" width="34" height="34" rx="5"/>
          <path d="M20 3v34M3 20h34"/>
          <circle cx="11.5" cy="11.5" r="3.4" fill="currentColor" stroke="none"/>
          <circle cx="28.5" cy="28.5" r="3.4" fill="currentColor" stroke="none"/>
        </svg>
        <span class="exName" data-i18n="exGorbov"></span>
        <span class="exWhat" data-i18n="exGorbovWhat"></span>
        <span class="exHint" id="hintGorbov"></span>
      </button>
    </nav>
    <div class="stageActions" style="justify-content:flex-start;">
      <button class="ghost" id="btnToStats" data-i18n="statsBtn"></button>
    </div>
    <details class="help">
      <summary data-i18n="howTitle"></summary>
      <div id="howBody"></div>
    </details>
  </section>

  <!-- ========== Screen: Schulte tables ========== -->
  <section id="scr-schulte" hidden>
    <div class="backRow"><button class="navBack">←&nbsp;<span data-i18n="back"></span></button></div>
    <section class="card controls" id="schSettings">
      <div class="ctl"><span class="lbl" data-i18n="setSize"></span>
        <div class="seg" id="segSize" role="group">
          <button data-v="4" aria-pressed="false">4×4</button>
          <button data-v="5" aria-pressed="true">5×5</button>
          <button data-v="6" aria-pressed="false">6×6</button>
        </div>
      </div>
      <div class="ctl"><span class="lbl" data-i18n="setMode"></span>
        <div class="seg" id="segMode" role="group">
          <button data-v="click" aria-pressed="true" data-i18n="modeClick"></button>
          <button data-v="gaze" aria-pressed="false" data-i18n="modeGaze"></button>
        </div>
      </div>
      <label class="chk"><input type="checkbox" id="chkAnchor" checked> <span data-i18n="anchor"></span></label>
    </section>
    <section class="card" id="schStage">
      <div id="hud" hidden>
        <span class="hudLeft" id="hudLeft"></span>
        <span class="hudRight"><span class="hudErr" id="hudErr"></span><span class="hudTimer" id="hudTimer"></span></span>
      </div>
      <div class="gridWrap" id="gridWrap" hidden>
        <div class="tblGrid" id="grid" data-size="5"></div>
        <div class="anchorDot"></div>
      </div>
      <div class="idlePane" id="schIdle">
        <p data-i18n="idleText"></p>
        <div class="stageActions">
          <button class="primary" id="btnStart" data-i18n="start"></button>
          <button class="ghost" id="btnSeries" data-i18n="series5"></button>
        </div>
      </div>
      <div id="schRunActions" hidden style="text-align:center; margin-top:14px;">
        <button class="primary" id="btnGazeFinish" hidden data-i18n="gazeFinish"></button>
        <button class="ghost" id="btnAbort" data-i18n="abort"></button>
      </div>
      <div class="resultPane" id="schResult" hidden></div>
    </section>
  </section>

  <!-- ========== Screen: red-black tables ========== -->
  <section id="scr-gorbov" hidden>
    <div class="backRow"><button class="navBack">←&nbsp;<span data-i18n="back"></span></button></div>
    <section class="card" id="gStage">
      <div id="gHud" hidden>
        <span class="hudLeft" id="gHudLeft"></span>

/* ================= 4. Pure logic (DOM-free) ================= */
const SCHEMA = 2;
const $ = id => document.getElementById(id);
const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
const pad = n => String(n).padStart(2, '0');
const rnd = n => Math.floor(Math.random() * n);
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function newId() {
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6);
}
const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const monthKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };

/* --- migration v1 -> v2 --- */
function migrateV1(old) {
  const records = [], sidMap = new Map();
  (old.attempts || []).forEach(a => {
    const id = newId() + '-' + records.length;
    const r = { id, ts: a.ts, kind: 'schulte', mode: a.mode, size: a.size, t: a.t };
    if (typeof a.err === 'number') r.err = a.err;
    if (Array.isArray(a.presses)) r.presses = a.presses.map(p => [p.p, Math.round(p.dt * 1000)]);
    if (a.sid) { r.sid = a.sid; if (!sidMap.has(a.sid)) sidMap.set(a.sid, []); sidMap.get(a.sid).push(id); }
    records.push(r);
  });
  (old.series || []).forEach(s => {
    records.push({
      id: newId() + '-s' + records.length, ts: s.ts, kind: 'series', mode: s.mode, size: s.size,
      times: s.times, er: s.er, vr: s.vr, pu: s.pu, attemptIds: sidMap.get(s.id) || []
    });
  });
  // point each attempt's sid at the new series id
  records.filter(r => r.kind === 'series').forEach(s => {
    s.attemptIds.forEach(aid => { const a = records.find(r => r.id === aid); if (a) a.sid = s.id; });
  });
  return records;
}
function emptyDB() {
  return { records: [], meta: { schemaVersion: SCHEMA, settings: {}, nback: { n: 2, failStreak: 0, updatedAt: 0 }, tombstones: [] } };
}
function normalizeMeta(m) {
  const d = emptyDB().meta;
  const meta = Object.assign(d, m || {});
  meta.schemaVersion = SCHEMA;
  meta.settings = Object.assign({ updatedAt: 0 }, meta.settings || {});
  meta.nback = Object.assign({ n: 2, failStreak: 0, updatedAt: 0 }, meta.nback || {});
  meta.tombstones = Array.isArray(meta.tombstones) ? meta.tombstones : [];
  return meta;
}

/* --- validation & merge --- */
function parseImport(text) {
  let j;
  try { j = JSON.parse(text); } catch (e) { throw new Error('errJson'); }
  if (!j || typeof j !== 'object') throw new Error('errShape');
  if (j.schema && j.schema > SCHEMA) throw new Error('errNewer');
  if (Array.isArray(j.attempts) || Array.isArray(j.series)) {   // legacy v1 export
    return { records: migrateV1(j), meta: normalizeMeta(null) };
  }
  if (!Array.isArray(j.records)) throw new Error('errShape');
  const ok = j.records.every(r => r && typeof r.id === 'string' && typeof r.ts === 'number' && typeof r.kind === 'string');
  if (!ok) throw new Error('errShape');

/* --- dual n-back: generation, scoring, level --- */
const NB_TRIAL_MS = 3000;
const NB_LETTERS = {
  ru: ['А', 'И', 'О', 'У', 'Ж', 'К', 'Ш', 'Р'],
  en: ['C', 'H', 'K', 'L', 'Q', 'R', 'S', 'T']

const NB_MATCH_P = 0.125, NB_LURE_P = 0.125;

function genChannel(n, count, values) {
  const seq = [];
  for (let i = 0; i < count; i++) {
    let v = values[rnd(values.length)];
    if (i >= n) {
      let back = null;
      const r1 = Math.random(), r2 = Math.random();
      if (r1 < NB_MATCH_P) back = n;
      else if (r2 < NB_LURE_P && n > 1) {

        if (cand.length) back = cand[rnd(cand.length)];

}

}

  const errs = pos.miss + pos.fa + aud.miss + aud.fa;
  const pct = scored > 0 ? Math.round((scored - errs) / scored * 100) : 0;

  if (pct < 50 && n > 1) {
    if (failStreak >= 2) return { n: n - 1, failStreak: 0, change: 'down' };
    return { n, failStreak: failStreak + 1, change: 'same' };

/* ================= 5. Storage adapters ================= */
const LS_KEY = 'schulte.v2', LS_KEY_V1 = 'schulte.v1', LS_SET_V1 = 'schulte.settings.v1';

function LocalAdapter() {
  let db = emptyDB(), st = 'idle';

    catch (e) { st = 'error'; console.warn('local write failed', e); }
  };

    kind: 'local',
    init() {
      try {

          db = { records: Array.isArray(j.records) ? j.records : [], meta: normalizeMeta(j.meta) };
        } else {

function CloudAdapter() {

    const olds = db.records.filter(r => r.kind !== 'agg').sort((a, b) => a.ts - b.ts).slice(0, 40);
    if (olds.length < 10) return false;
    const groups = new Map();

      const lvls = rs.filter(r => typeof r.n === 'number').map(r => r.n);

      enqueue({ key: keyFor(r), val: JSON.stringify(r) });
    },
    deleteRecord(id) {
      const r = db.records.find(x => x.id === id);
      db.records = db.records.filter(x => x.id !== id);
      if (!db.meta.tombstones.includes(id)) db.meta.tombstones.push(id);
      if (r) enqueue({ key: keyFor(r), del: true });
      const t = db.meta.tombstones;
      for (let i = 0, k = 0; i < t.length; i += 120, k++) {
        enqueue({ key: k ? 'tomb:' + k : 'tomb', val: JSON.stringify(t.slice(i, i + 120)) });
      }

    putMeta(m) { db.meta = m; enqueue({ key: 'meta', val: JSON.stringify(m) }); },
    replaceAll(next) {

    status() { return st; }

  if (SCREEN === 'nback' && NB.phase === 'running') {
    if (e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф') { e.preventDefault(); nbAnswer('pos'); }
    else if (e.key === 'l' || e.key === 'L' || e.key === 'д' || e.key === 'Д') { e.preventDefault(); nbAnswer('aud'); }
    else if (e.key === 'Escape') nbAbort();
    return;
  }
  if (e.code === 'Space') {
    if (SCREEN === 'schulte') {
      if (SG.phase === 'running' && SG.run.mode === 'gaze') { e.preventDefault(); schFinish(performance.now()); }
      else if (SG.phase === 'done') { e.preventDefault(); schBegin(); }
    } else if (SCREEN === 'gorbov' && GG.phase === 'done') { e.preventDefault(); gBegin(); }
    else if (SCREEN === 'nback' && NB.phase === 'done') { e.preventDefault(); nbBegin(); }
  } else if (e.key === 'Escape') {
    if (SCREEN === 'schulte') { if (SG.phase === 'running') schAbort(); else if (SG.phase === 'done') { SG.series = null; schPhase('idle'); } }
    else if (SCREEN === 'gorbov') { if (GG.phase === 'running') gAbort(); else if (GG.phase === 'done') gPhase('idle'); }

    const bw = box.clientWidth;
    tt.style.display = 'block';
    tt.style.left = Math.min(Math.max(X(d.ts) / W * bw + 12, 0), Math.max(0, bw - 150)) + 'px';
    tt.style.top = (Y(d.avg) / H * box.clientHeight - 10) + 'px';
    cross.setAttribute('x1', X(d.ts)); cross.setAttribute('x2', X(d.ts));
    cross.setAttribute('visibility', 'visible');
  };
  const hideTT = () => { tt.style.display = 'none'; cross.setAttribute('visibility', 'hidden'); };
  svg.addEventListener('pointermove', e => {
    const rect = svg.getBoundingClientRect();
    const mx = (e.clientX - rect.left) / rect.width * W;
    let best = 0;
    days.forEach((d, i) => { if (Math.abs(X(d.ts) - mx) < Math.abs(X(days[best].ts) - mx)) best = i; });
    showTT(best);
  });
  svg.addEventListener('pointerleave', hideTT);
  svg.addEventListener('focusin', e => { if (e.target.dataset.i !== undefined) showTT(+e.target.dataset.i); });
  svg.addEventListener('focusout', hideTT);
}
function delButton(onConfirm) {
  const b = document.createElement('button');
  b.className = 'rowDel'; b.textContent = '×';
  b.title = t('del'); b.setAttribute('aria-label', t('del'));
  b.addEventListener('click', () => armButton(b, {
    arm: x => { x.classList.add('armed'); x.textContent = '?'; x.title = t('delConfirm'); },
    disarm: x => { x.classList.remove('armed'); x.textContent = '×'; x.title = t('del'); }
  }, onConfirm));
  return b;
}
function renderSeries() {
  const box = $('seriesBox'); box.replaceChildren();
  const rows = DB.records.filter(r => r.kind === 'series' && r.mode === (S().fMode || 'click') && r.size === (S().fSize || 5)).slice(-8).reverse();
  if (!rows.length) {
    const e = document.createElement('div'); e.className = 'empty'; e.textContent = t('seriesEmpty');
    box.append(e); return;
  }
  const tbl = document.createElement('table');
  const th = document.createElement('tr');
  [t('thSDate'), t('thT15'), t('thER'), t('thVR'), t('thPU'), ''].forEach((h, i) => {
    const c = document.createElement('th');
    if (i >= 2 && i <= 4) c.className = 'num';
    if (i === 5) c.className = 'delCol';
    c.textContent = h; th.append(c);
  });
  tbl.append(th);
  rows.forEach(s => {
    const tr = document.createElement('tr');
    [fmtDT(s.ts), s.times.map(fmtS).join(' · '), fmtS(s.er)].forEach((v, i) => {
      const td = document.createElement('td');
      if (i === 2) td.className = 'num';
      td.textContent = v; tr.append(td);
    });
    [s.vr, s.pu].forEach(v => {
      const td = document.createElement('td'); td.className = 'num';
      td.append(fmtS(v));
      if (v <= 1) { const ok = document.createElement('span'); ok.className = 'okmark'; ok.textContent = ' ✓'; td.append(ok); }
      tr.append(td);
    });
    const td = document.createElement('td'); td.className = 'delCol';
    td.append(delButton(() => delRecord(s.id)));
    tr.append(td); tbl.append(tr);
  });
  box.append(tbl);
}
function renderHeat(F, ex) {
  const heat = $('heat'); heat.replaceChildren();
  const old = $('heatBox').querySelector('.tt'); if (old) old.remove();
  const size = ex === 'gorbov' ? 7 : (S().fSize || 5);
  const withP = F.filter(a => Array.isArray(a.presses) && a.presses.length);
  if (ex === 'schulte' && (S().fMode || 'click') !== 'click') { $('heatHint').textContent = t('heatNA'); return; }
  if (withP.length < 3) { $('heatHint').textContent = t('heatNeed')(withP.length); return; }
  $('heatHint').textContent = t('heatHint');
  const n = size * size, sum = new Array(n).fill(0), cnt = new Array(n).fill(0);
  withP.forEach(a => a.presses.forEach(p => { if (p[0] < n) { sum[p[0]] += p[1] / 1000; cnt[p[0]]++; } }));
  const avg = sum.map((s, i) => cnt[i] ? s / cnt[i] : null);
  const vals = avg.filter(v => v !== null);
  if (!vals.length) { $('heatHint').textContent = t('heatNeed')(0); return; }
  const lo = Math.min(...vals), hi = Math.max(...vals), RM = ramp();
  heat.style.gridTemplateColumns = 'repeat(' + size + ', 1fr)';
  const tt = document.createElement('div'); tt.className = 'tt'; $('heatBox').append(tt);
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div'); c.className = 'hc'; c.tabIndex = 0;
    if (avg[i] === null) { c.style.background = 'var(--hairline)'; c.textContent = '·'; }
    else {
      const t01 = hi === lo ? 0.5 : (avg[i] - lo) / (hi - lo);
      const col = RM[Math.min(RM.length - 1, Math.floor(t01 * RM.length))];
      c.style.background = col; c.style.color = inkFor(col); c.textContent = fmtS(avg[i]);
    }
    const show = () => {
      if (avg[i] === null) return;
      tt.replaceChildren();
      const v = document.createElement('div'); v.className = 'v'; v.textContent = fmtSU(avg[i]); tt.append(v);
      const r2 = document.createElement('div');
      r2.textContent = t('heatCell')(Math.floor(i / size) + 1, i % size + 1, cnt[i]);
      tt.append(r2);
      const hb = $('heatBox').getBoundingClientRect(), cb = c.getBoundingClientRect();
      tt.style.display = 'block';
      tt.style.left = Math.min(cb.left - hb.left + cb.width + 6, Math.max(0, hb.width - 175)) + 'px';
      tt.style.top = (cb.top - hb.top) + 'px';
    };
    const hide = () => { tt.style.display = 'none'; };
    c.addEventListener('pointerenter', show); c.addEventListener('pointerleave', hide);
    c.addEventListener('focus', show); c.addEventListener('blur', hide);
    heat.append(c);
  }
}
function renderAttempts(F, ex) {
  const box = $('attemptsBox'); box.replaceChildren();
  if (!F.length) {
    const e = document.createElement('div'); e.className = 'empty'; e.textContent = t('attemptsEmpty');
    box.append(e); return;
  }
  const heads = ex === 'nback'
    ? [t('thWhen'), t('thLevel'), t('thScore'), t('thPos'), t('thAud'), '']
    : [t('thWhen'), t('thTime'), t('thErr'), t('thAvgInt'), t('thMaxP'), ''];
  const tbl = document.createElement('table');
  const th = document.createElement('tr');
  heads.forEach((h, i) => {
    const c = document.createElement('th');
    if (i >= 1 && i <= 4) c.className = 'num';
    if (i === 5) c.className = 'delCol';
    c.textContent = h; th.append(c);
  });
  tbl.append(th);
  F.slice(-15).reverse().forEach(a => {
    const tr = document.createElement('tr');
    let cells;
    if (ex === 'nback') {
      const acc = s => s.hit + '/' + (s.hit + s.miss) + (s.fa ? ' (+' + s.fa + ')' : '');
      cells = [fmtDT(a.ts), String(a.n), a.pct + '%', acc(a.pos), acc(a.aud)];
    } else {
      let maxP = '—', avgP = '—', err = typeof a.err === 'number' ? String(a.err) : '—';
      if (Array.isArray(a.presses) && a.presses.length) {
        const dts = a.presses.map(p => p[1] / 1000);
        avgP = fmtSU(mean(dts));
        let mi = 0; dts.forEach((d, j) => { if (d > dts[mi]) mi = j; });
        const label = ex === 'gorbov'
          ? (gorbovTarget(mi).red ? t('gRed') : t('gBlack')) + ' ' + gorbovTarget(mi).n
          : String(mi + 1);
        maxP = fmtSU(dts[mi]) + ' (' + label + ')';
      }
      cells = [fmtDT(a.ts), fmtSU(a.t), err, avgP, maxP];
    }
    cells.forEach((v, i) => {
      const td = document.createElement('td');
      if (i >= 1) td.className = 'num';
      td.textContent = v; tr.append(td);
    });
    const td = document.createElement('td'); td.className = 'delCol';
    td.append(delButton(() => delRecord(a.id)));
    tr.append(td); tbl.append(tr);
  });
  box.append(tbl);
}

/* ================= 15. Export / import / wipe ================= */
function exportPayload() {
  return JSON.stringify({
    schema: SCHEMA, exportedAt: Date.now(),
    records: DB.records, tombstones: DB.meta.tombstones,
    meta: { settings: DB.meta.settings, nback: DB.meta.nback }
  }, null, 2);
}
$('btnExport').addEventListener('click', () => {
  const blob = new Blob([exportPayload()], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'focustrack-data.json'; a.click();
  URL.revokeObjectURL(a.href);
});
$('btnCopy').addEventListener('click', async () => {
  const rep = $('importReport');
  try {
    await navigator.clipboard.writeText(exportPayload());
    rep.textContent = t('copied'); rep.className = 'note'; rep.hidden = false;
  } catch (e) {
    rep.textContent = String(e); rep.className = 'note warn'; rep.hidden = false;
  }
});
$('btnImport').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const rep = $('importReport');
  try {
    const incoming = parseImport(await file.text());
    const before = DB.records.length;
    const res = mergeDB(DB, incoming);
    ADP.replaceAll(res.db); DB = res.db;
    const added = DB.records.length - before;
    rep.textContent = t('importOk')(added, incoming.records.length - added);
    rep.className = 'note'; rep.hidden = false;
    renderStats(); renderHome();
  } catch (err) {
    const key = err && err.message && STR[LANG][err.message] ? err.message : 'errShape';
    rep.textContent = t('importErr')(t(key));
    rep.className = 'note warn'; rep.hidden = false;
  }
});
$('btnWipe').addEventListener('click', () => {
  armButton($('btnWipe'), {
    arm: b => { b.textContent = t('wipeConfirm'); b.style.color = 'var(--crit)'; },
    disarm: b => { b.textContent = t('wipe'); b.style.color = ''; }
  }, () => {
    const fresh = emptyDB();
    fresh.meta.settings = Object.assign({}, DB.meta.settings, { updatedAt: Date.now() });
    ADP.replaceAll(fresh); DB = fresh;
    renderStats(); renderHome();
  });
});

/* ================= 16. Boot ================= */
async function boot() {
  const tg = isTelegram();
  if (TG) { try { TG.ready(); TG.expand(); } catch (e) {} }
  ADP = tg ? CloudAdapter() : LocalAdapter();
  try { DB = await ADP.init(); } catch (e) { console.warn('init failed', e); DB = emptyDB(); }
  DB.meta = normalizeMeta(DB.meta);

  LANG = S().lang || ((navigator.language || 'ru').toLowerCase().indexOf('ru') === 0 ? 'ru' : 'en');
  if (TG && TG.colorScheme) {
    document.documentElement.dataset.theme = TG.colorScheme;
    if (TG.onEvent) TG.onEvent('themeChanged', () => {
      document.documentElement.dataset.theme = TG.colorScheme;
      if (SCREEN === 'stats') renderStats();
    });
  }
  segInit($('segLang'), LANG, v => { LANG = v; saveSettings({ lang: v }); applyLang(); });
  segInit($('segSize'), S().size || 5, v => saveSettings({ size: +v }));
  segInit($('segMode'), S().mode || 'click', v => saveSettings({ mode: v }));
  $('chkAnchor').checked = S().anchor !== false;
  $('chkAnchor').addEventListener('change', e => saveSettings({ anchor: e.target.checked }));
  segInit($('segNbSet'), S().nbSet || LANG, v => { saveSettings({ nbSet: v }); nbCheckVoice(); });
  segInit($('fEx'), S().fEx || 'schulte', v => { saveSettings({ fEx: v }); renderStats(); });
  segInit($('fMode'), S().fMode || 'click', v => { saveSettings({ fMode: v }); renderStats(); });
  segInit($('fSize'), S().fSize || 5, v => { saveSettings({ fSize: +v }); renderStats(); });

  $('loading').hidden = true;
  applyLang();
  go('home');
}
boot();
